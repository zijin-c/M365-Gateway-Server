services:
  gateway:
    build: .
    container_name: m365-gateway
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    ports:
      - "${GATEWAY_BIND_IP:-0.0.0.0}:${PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
