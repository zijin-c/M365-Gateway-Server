services:
  gateway:
    build: .
    container_name: m365-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_BIND_IP:-0.0.0.0}:${PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
