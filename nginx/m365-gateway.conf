# ==============================================================================
# M365 Gateway Nginx 反向代理配置模板
# 适用于 Ubuntu/Debian (/etc/nginx/sites-available/ 或 /etc/nginx/conf.d/)
# ==============================================================================

# HTTP 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com; # 替换为您的实际域名

    # 用于 Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com; # 替换为您的实际域名

    # SSL 证书配置（Certbot 自动生成路径示例）
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全参数推荐
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 客户端请求体大小（支持多模态图像/附件上传）
    client_max_body_size 50M;

    location / {
        # 后端 M365 Gateway 监听端口（默认 8787）
        proxy_pass http://127.0.0.1:8787;

        # HTTP 1.1 保持连接
        proxy_http_version 1.1;

        # WebSocket 支持（用于微软 ChatHub 实时通信）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真实 IP 与代理链标头（保证登录频控与审计准确）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======================================================================
        # [至关重要] 流式传输（SSE）与长连接优化
        # 必须关闭代理缓冲，否则 AI 输出和控制台打字机效果会严重卡顿
        # ======================================================================
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 避免长时间长文本思考或大上下文推理导致反代超时中断
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
