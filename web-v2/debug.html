<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>M365 Gateway · 诊断记录</title>
  <style>
    :root{font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f8fafc;background:#090d16}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px;box-shadow:0 16px 40px -24px rgba(0,0,0,.7)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;font-weight:800}
    h1{font-size:20px;margin:0 0 8px;color:#fff}p{color:#94a3b8;line-height:1.7;margin:0 0 18px;font-size:14px}a{display:inline-flex;padding:10px 16px;border-radius:10px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:600;font-size:14px}a:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">MG</span><strong>M365 Gateway / Cloudflare Native</strong></div>
    <h1>诊断记录已合并到管理后台</h1>
    <p>旧调试页曾尝试展示服务端不会返回的原始请求与敏感上游内容。现已统一迁移至控制台内部有界、脱敏的请求终态诊断记录中。</p>
    <a href="/" id="continueLink">前往新版控制台 &rarr;</a>
  </main>
  <script>
    try{sessionStorage.setItem('m365.currentPage','diagnostics')}catch{}
    document.getElementById('continueLink').focus();
  </script>
</body>
</html>
