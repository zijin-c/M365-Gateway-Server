<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M365 Gateway 管理登录 · 日月微晶控制台</title>
  <style>
    :root {
      /* 纯黑深邃夜空 */
      --bg-color: #000000;
      --glass-bg: rgba(255, 255, 255, 0.035);
      --glass-bg-hover: rgba(255, 255, 255, 0.065);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-light: rgba(255, 255, 255, 0.38);
      --glass-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95);
      --glass-inset-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.28);
      --glass-blur: blur(40px) saturate(180%);
      
      --accent-blue: #38bdf8;
      --accent-blue-glow: rgba(56, 189, 248, 0.35);
      --accent-emerald: #34d399;
      --accent-rose: #f43f5e;
      
      --text-main: #ffffff;
      --text-secondary: #cbd5e1;
      --text-dim: #718096;
      
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #38bdf8;
      --modal-mask: rgba(0, 0, 0, 0.8);
      
      --radius-xl: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    /* 纯白日光模式 */
    body.theme-light {
      --bg-color: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-bg-hover: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-light: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.08);
      --glass-inset-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
      --glass-blur: blur(30px) saturate(180%);
      
      --accent-blue: #0284c7;
      --accent-blue-glow: rgba(2, 132, 199, 0.2);
      --accent-emerald: #059669;
      --accent-rose: #e11d48;
      
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-dim: #94a3b8;
      
      --input-bg: rgba(0, 0, 0, 0.035);
      --input-border: rgba(0, 0, 0, 0.08);
      --input-focus: #0284c7;
      --modal-mask: rgba(15, 23, 42, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.14) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.05) 0px, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.theme-light {
      background-image:
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.06) 0px, transparent 50%);
    }

    /* 日月天体照明系统 (最高层级，支持一直切换) */
    .celestial-sun {
      position: fixed;
      top: 20px;
      left: 24px;
      width: 58px;
      height: 58px;
      z-index: 9999 !important;
      cursor: pointer !important;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .celestial-sun:hover {
      transform: scale(1.15);
    }

    .sun-core {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 
        0 0 16px #ffffff,
        0 0 32px rgba(255, 255, 255, 0.9),
        0 0 60px rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
    }

    body.theme-light .sun-core {
      border: 2px solid #eab308;
      box-shadow: 0 0 16px #facc15, 0 0 35px rgba(250, 204, 21, 0.6), 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .sun-corona {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.5);
      animation: spinSun 30s linear infinite;
    }

    body.theme-light .sun-corona {
      border-color: rgba(234, 179, 8, 0.6);
    }

    .sun-beam-illumination {
      position: fixed;
      top: -200px;
      left: -200px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseSunBeam 10s ease-in-out infinite alternate;
    }

    .celestial-moon {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 58px;
      height: 58px;
      z-index: 9999 !important;
      cursor: pointer !important;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .celestial-moon:hover {
      transform: scale(1.15);
    }

    .moon-body {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e293b, #020617);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 0 14px rgba(148, 163, 184, 0.4),
        inset -4px -3px 6px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }

    body.theme-light .moon-body {
      background: radial-gradient(circle at 35% 35%, #334155, #0f172a);
      border: 1.5px solid rgba(15, 23, 42, 0.4);
      box-shadow: 0 0 16px rgba(15, 23, 42, 0.3), 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    .moon-crescent {
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      box-shadow: inset 5px 2px 0 0 rgba(255, 255, 255, 0.85);
    }

    .moon-halo {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px dotted rgba(255, 255, 255, 0.25);
      animation: spinMoon 40s linear infinite reverse;
    }

    body.theme-light .moon-halo {
      border-color: rgba(15, 23, 42, 0.3);
    }

    .moon-beam-illumination {
      position: fixed;
      top: -200px;
      right: -200px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(148, 163, 184, 0.16) 0%, rgba(100, 116, 139, 0.04) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseMoonBeam 12s ease-in-out infinite alternate;
    }

    @keyframes spinSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinMoon { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseSunBeam { 0% { transform: scale(0.95); opacity: 0.75; } 100% { transform: scale(1.08); opacity: 1; } }
    @keyframes pulseMoonBeam { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.12); opacity: 0.95; } }

    /* 完全透明微晶玻璃登录卡片 */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-light);
      border-radius: var(--radius-xl);
      padding: 44px 36px;
      box-shadow: var(--glass-shadow), 0 0 35px -5px rgba(56, 189, 248, 0.12), var(--glass-inset-glow);
      animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px var(--accent-blue-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-icon:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 600;
    }

    .badge-client {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body.theme-light .badge-client {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-secondary);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
    }

    .alert {
      display: none;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .alert-error {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 46px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 0 46px 0 16px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--accent-blue-glow);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 18px var(--accent-blue-glow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1.5px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.5);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 首次改密模态框 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-mask);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-glass {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-light);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--glass-shadow);
      animation: cardAppear 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 22px;
    }
  </style>
</head>
<body>
  <!-- 左上方纯白太阳 (点击一直切换) -->
  <div class="celestial-sun" id="celestialSun" role="button" tabindex="0" title="纯白太阳 · 点击一直切换">
    <div class="sun-core"></div>
    <div class="sun-corona"></div>
  </div>
  <div class="sun-beam-illumination"></div>

  <!-- 右上方深黑月亮 (点击一直切换) -->
  <div class="celestial-moon" id="celestialMoon" role="button" tabindex="0" title="玄黑夜月 · 点击一直切换">
    <div class="moon-body">
      <div class="moon-crescent"></div>
    </div>
    <div class="moon-halo"></div>
  </div>
  <div class="moon-beam-illumination"></div>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <h1>M365 Gateway</h1>
      <p>
        <span>运维控制台</span>
        <span class="badge-status"><span class="pulse-dot"></span>已连线</span>
        <span class="badge-client" title="微软 365 客户端应用已配置: c0ab8ce9-e9a0-42e7-b064-33d422df41f1">Client: c0ab8ce9...41f1</span>
      </p>
    </div>

    <div id="alertBox" class="alert" role="status" aria-live="polite"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="passwordInput">管理员口令 (ADMIN_PASSWORD)</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="请输入管理员密码" 
            required 
            autocomplete="current-password"
            autofocus 
          />
          <button type="button" id="togglePassword" class="toggle-pwd" aria-label="切换密码明文">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnSpinner" class="spinner"></span>
        <span id="btnText">验证登录</span>
      </button>
    </form>

    <div class="footer">
      <span>Cloudflare Edge 原生驱动 &bull; 随机初始密码仅在部署终端显示一次</span>
    </div>
  </div>

  <!-- 强制首次改密弹窗 -->
  <div id="changePasswordModal" class="modal-backdrop">
    <div class="modal-glass" role="dialog" aria-modal="true" aria-labelledby="changePasswordTitle">
      <h2 class="modal-title" id="changePasswordTitle">首次登录安全改密</h2>
      <p class="modal-desc">系统检测到您当前使用的是初始配置口令。为了保障网关凭据与多租户账号池安全，请设置高强度新密码（至少 8 位）。</p>
      
      <div id="modalAlert" class="alert" role="status" aria-live="polite"></div>

      <form id="changePasswordForm">
        <div class="form-group">
          <label class="form-label" for="newPassword">新管理员密码</label>
          <input type="password" id="newPassword" class="form-input" placeholder="至少 8 位新密码" minlength="8" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入新密码" minlength="8" required autocomplete="new-password" />
        </div>
        <button type="submit" id="modalSubmitBtn" class="btn-submit">
          <span id="modalSpinner" class="spinner"></span>
          <span>更新密码并进入控制台</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const sunEl = document.getElementById("celestialSun");
      const moonEl = document.getElementById("celestialMoon");

      function applyTheme(theme) {
        if (theme === "light") {
          document.body.classList.add("theme-light");
          if (sunEl) sunEl.style.transform = "scale(1.15)";
          if (moonEl) moonEl.style.transform = "scale(0.9)";
        } else {
          document.body.classList.remove("theme-light");
          if (sunEl) sunEl.style.transform = "scale(0.9)";
          if (moonEl) moonEl.style.transform = "scale(1.15)";
        }
        localStorage.setItem("m365_gateway_theme", theme);
      }

      function toggleTheme() {
        const isLight = document.body.classList.contains("theme-light");
        const next = isLight ? "dark" : "light";
        applyTheme(next);
      }

      const savedTheme = localStorage.getItem("m365_gateway_theme") || "dark";
      applyTheme(savedTheme);

      // 支持无限次一直往复切换
      sunEl?.addEventListener("click", toggleTheme);
      moonEl?.addEventListener("click", toggleTheme);

      const loginForm = document.getElementById("loginForm");
      const passwordInput = document.getElementById("passwordInput");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");
      const alertBox = document.getElementById("alertBox");
      const togglePassword = document.getElementById("togglePassword");

      const changeModal = document.getElementById("changePasswordModal");
      const changeForm = document.getElementById("changePasswordForm");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const modalAlert = document.getElementById("modalAlert");
      const modalSubmitBtn = document.getElementById("modalSubmitBtn");
      const modalSpinner = document.getElementById("modalSpinner");

      let cachedCurrentPassword = "";

      togglePassword.addEventListener("click", () => {
        const isPwd = passwordInput.type === "password";
        passwordInput.type = isPwd ? "text" : "password";
        togglePassword.style.color = isPwd ? "var(--accent-blue)" : "var(--text-dim)";
      });

      function showAlert(el, msg, isError = true) {
        el.className = "alert " + (isError ? "alert-error" : "alert-success");
        el.textContent = msg;
        el.style.display = "block";
      }

      function hideAlert(el) {
        el.style.display = "none";
        el.textContent = "";
      }

      fetch("/api/admin/session")
        .then((res) => (res.ok ? res.json() : null))
        .then((data) => {
          if (data && data.authenticated) {
            if (!data.must_change_password) {
              window.location.replace("/");
            } else {
              showAlert(alertBox, "请输入当前初始密码以继续完成首次改密");
              passwordInput.focus();
            }
          }
        })
        .catch(() => {});

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert(alertBox);
        const password = passwordInput.value;
        if (!password) return;

        submitBtn.disabled = true;
        btnSpinner.style.display = "inline-block";
        btnText.textContent = "正在验证...";

        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            if (res.status === 429) {
              showAlert(alertBox, "密码尝试过于频繁，IP已被锁定，请稍后重试");
            } else {
              showAlert(alertBox, data?.error?.message || "管理员口令错误，请核对后重试");
            }
            passwordInput.focus();
            passwordInput.select();
            return;
          }

          cachedCurrentPassword = password;

          if (data.must_change_password) {
            changeModal.style.display = "flex";
            newPasswordInput.focus();
          } else {
            showAlert(alertBox, "验证通过，正在进入控制台...", false);
            setTimeout(() => {
              window.location.replace("/");
            }, 500);
          }
        } catch (err) {
          showAlert(alertBox, "网络连接异常，请检查网关状态后重试");
        } finally {
          submitBtn.disabled = false;
          btnSpinner.style.display = "none";
          btnText.textContent = "验证登录";
        }
      });

      changeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert(modalAlert);
        const newPwd = newPasswordInput.value;
        const confirmPwd = confirmPasswordInput.value;

        if (newPwd.length < 8) {
          showAlert(modalAlert, "新密码长度至少需要 8 个字符");
          return;
        }

        if (newPwd !== confirmPwd) {
          showAlert(modalAlert, "两次输入的新密码不一致，请核对");
          return;
        }

        modalSubmitBtn.disabled = true;
        modalSpinner.style.display = "inline-block";

        try {
          const res = await fetch("/api/admin/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              current_password: cachedCurrentPassword,
              new_password: newPwd,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showAlert(modalAlert, data?.error?.message || "改密失败，请重试");
            return;
          }

          showAlert(modalAlert, "密码已更新！请使用新密码重新登录", false);
          cachedCurrentPassword = "";
          newPasswordInput.value = "";
          confirmPasswordInput.value = "";
          setTimeout(() => {
            changeModal.style.display = "none";
            passwordInput.value = "";
            passwordInput.focus();
            showAlert(alertBox, "密码已修改，请输入新密码登录系统", false);
          }, 1200);
        } catch (err) {
          showAlert(modalAlert, "改密请求失败，请稍后重试");
        } finally {
          modalSubmitBtn.disabled = false;
          modalSpinner.style.display = "none";
        }
      });
    })();
  </script>
</body>
</html>
